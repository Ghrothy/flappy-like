<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Pip's Peril</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23ffd166'/%3E%3Ccircle cx='21' cy='12' r='4' fill='%23fff'/%3E%3Ccircle cx='22' cy='12' r='1.8' fill='%2322293b'/%3E%3Cpath d='M24 15 L30 17 L24 19 Z' fill='%23ff8f3f'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="game-shell">
    <div class="stage" id="stage">
      <canvas id="game-canvas"></canvas>

      <div class="hud" id="hud" aria-hidden="true">
        <div class="score" id="score">0</div>
        <div class="best">Best <span id="best">0</span></div>
      </div>

      <!-- Start screen -->
      <div class="overlay" id="screen-start">
        <h1 class="title">Pip&rsquo;s Peril</h1>
        <p class="tagline">Guide the little flapper through the gates.</p>
        <ul class="instructions">
          <li><kbd>Space</kbd> / <kbd>Click</kbd> / <kbd>Tap</kbd> &mdash; flap upward</li>
          <li>Gravity pulls you down &mdash; flap often</li>
          <li>Pass a gate to score a point</li>
        </ul>
        <button class="btn" id="btn-start" type="button">Start flying</button>
        <p class="hint">or press Space</p>
      </div>

      <!-- Game over screen -->
      <div class="overlay hidden" id="screen-over">
        <h2 class="title small">Run ended</h2>
        <div class="final-score">
          <span class="label">Score</span>
          <span class="value" id="final-score">0</span>
        </div>
        <div class="final-best" id="final-best-label">Best 0</div>
        <p class="reason" id="over-reason"></p>
        <button class="btn" id="btn-restart" type="button">Restart</button>
        <p class="hint">or press Space</p>
      </div>

      <div class="rotate-hint">Rotate your device for a wider view</div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/entities.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
